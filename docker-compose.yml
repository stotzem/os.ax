services:
  webserver:
    container_name: apache-php
    build:
      context: .
      dockerfile: ./docker/apache-php.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - ./docker/sites.conf:/etc/apache2/sites-available/000-default.conf
      - ./docker/ports.conf:/etc/apache2/ports.conf
    depends_on:
      - db
    networks:
      - network
  db:
    container_name: mariadb
    image: mariadb:10.6
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: ${SQL_DATABASE}
      MYSQL_USER: ${SQL_USERNAME}
      MYSQL_PASSWORD: ${SQL_PASSWORD}
      MYSQL_HOST: '%'
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - network
volumes:
  mariadb-data:
networks:
  network:
    driver: bridge
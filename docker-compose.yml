services:
  webserver:
    container_name: apache-php
    build:
      context: .
      dockerfile: ./apache-php.Dockerfile
    ports:
      - "80:80"
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - network
  db:
    container_name: mariadb
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${SQL_ROOTPASS}
      MYSQL_DATABASE: ${SQL_DATABASE}
      MYSQL_USER: ${SQL_USERNAME}
      MYSQL_PASSWORD: ${SQL_PASSWORD}
      MYSQL_HOST: '%'
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - network
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    depends_on:
      - db
    environment:
      PMA_AUTH_TYPE: config
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${SQL_ROOTPASS}
    ports:
      - "9000:80"
    networks:
      - network
volumes:
  mariadb-data:
networks:
  network:
    driver: bridge